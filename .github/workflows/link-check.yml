name: Link check

# Checks every link on the site. Runs on the 1st of each month, on demand,
# and on pushes to the link-check branch. Results appear in the run summary.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 1 * *"
  push:
    branches: [link-check]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress
            --max-concurrency 4 --timeout 30 --max-retries 2
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
            index.html
          format: detailed
          output: lychee-report.md
          jobSummary: true
          fail: false
      - name: Print report
        run: cat lychee-report.md
