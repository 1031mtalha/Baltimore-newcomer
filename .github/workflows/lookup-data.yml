name: Lookup data probe
on:
  push:
    branches: [district-lookup-data]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Census geocoder CORS and results
        run: |
          mkdir -p out
          for A in "100 Holliday St, Baltimore, MD 21202" "400 Washington Ave, Towson, MD 21204" "1100 Mace Ave, Essex, MD 21221"; do
            Q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$A")
            echo "=== CENSUS $A"
            curl -sS -D - -o /tmp/c.json -H "Origin: https://baltimorenewcomer.org" \
              "https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress?address=$Q&benchmark=Public_AR_Current&vintage=Current_Current&layers=Counties&format=json" | grep -iE "^HTTP|access-control" || true
            python3 -c "import json;d=json.load(open('/tmp/c.json'));m=d['result']['addressMatches'];print(len(m),'match');[print(x['matchedAddress'],x['coordinates'],[ (c['GEOID'],c['NAME']) for c in x['geographies']['Counties']]) for x in m[:1]]" || head -c 400 /tmp/c.json
          done
          echo "=== CENSUS JSONP"
          curl -sS "https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress?address=100+Holliday+St%2C+Baltimore%2C+MD+21202&benchmark=Public_AR_Current&vintage=Current_Current&layers=Counties&format=jsonp&callback=cb" | head -c 200; echo
          echo "=== NOMINATIM"
          curl -sS -D - -o /tmp/n.json -A "baltimorenewcomer.org lookup test" -H "Origin: https://baltimorenewcomer.org" \
            "https://nominatim.openstreetmap.org/search?q=400+Washington+Ave%2C+Towson%2C+MD+21204&format=jsonv2&addressdetails=1&limit=1&countrycodes=us" | grep -iE "^HTTP|access-control" || true
          head -c 600 /tmp/n.json; echo
      - name: ZIP to county table (Census 2020 ZCTA relationship file)
        run: |
          curl -sS -o rel.txt https://www2.census.gov/geo/docs/maps-data/data/rel2020/zcta520/tab20_zcta520_county20_natl.txt
          head -2 rel.txt
          python3 - <<'PY'
          import csv, json, collections
          rows=list(csv.DictReader(open('rel.txt',encoding='utf-8-sig'),delimiter='|'))
          print(rows[0].keys())
          z=collections.defaultdict(dict); tot=collections.defaultdict(float)
          for r in rows:
              zc=r['GEOID_ZCTA5_20']; co=r['GEOID_COUNTY_20']
              if not zc: continue
              a=float(r['AREALAND_PART'] or 0)
              tot[zc]+=a
              if co in ('24510','24005'): z[zc][co]=a
          out={}
          for zc,d in z.items():
              out[zc]={co: round(a/tot[zc],4) for co,a in d.items()}
          json.dump(out,open('out/zip_county.json','w'),indent=0,sort_keys=True)
          print(len(out),'ZIPs touch City or County')
          for zc,d in sorted(out.items()): print(zc,d)
          PY
      - name: City and County boundaries (Census cartographic 500k, 2023)
        run: |
          curl -sS -o cb.zip https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_county_500k.zip
          unzip -q cb.zip -d cb
          npx -y mapshaper@0.6.102 cb/cb_2023_us_county_500k.shp -filter 'GEOID=="24510"||GEOID=="24005"' -filter-fields GEOID,NAME,NAMELSAD -proj wgs84 -o format=geojson precision=0.00001 out/baltimore_boundaries.geojson
          ls -la out; head -c 300 out/baltimore_boundaries.geojson
      - name: Commit data back to branch
        run: |
          mkdir -p data && cp out/* data/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data && git commit -m "Lookup data from Census" && git push
